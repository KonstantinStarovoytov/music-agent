[project]
name = "musicagent"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "deepagents>=0.7.13",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain>=1.4.0",
    "langchain-openai>=1.6.0",
    "langfuse>=4.15.1",
    "langgraph>=1.2.11",
    "psycopg[binary]>=3.3.5",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "sqlalchemy>=2.0.52",
    "sse-starlette>=3.4.10",
    "uvicorn>=0.52.4",
]

# Not imported anywhere in src/ or tests/ yet -- these belong to the phase-2
# roadmap (Release Assistant subagents / RAG on pgvector / MCP server, see
# spec.md section 8), not the deployed MVP. Kept as an optional group so the
# deployed install (`uv sync` without --extra) stays small.
[project.optional-dependencies]
phase2 = [
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.4.0",
    "langchain-groq>=1.1.3",
    "langchain-postgres>=0.0.17",
    "mcp[cli]>=2.1.1",
]

# Audio analysis of Deezer preview clips (src/musicagent/audio.py), an
# enrichment provider used when Deezer/GetSongBPM/MusicBrainz-AcousticBrainz
# don't together supply both bpm and camelot -- optional because essentia
# costs ~190MB RSS to import and also needs the ffmpeg binary (not installable
# via pip) on PATH. Without this extra (and/or without ffmpeg), the provider
# degrades to a no-op and the app runs on the metadata providers alone.
# Pinned exactly (rather than a lower bound): essentia publishes frequent dev
# builds and the newest ones on PyPI at the time of writing only ship a
# cp314 wheel, not cp313 (this project's pinned interpreter) -- a >= bound
# would happily resolve to one of those and fail to install.
audio = [
    "essentia==2.1b6.dev1389",
]

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.16.6",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/musicagent"]

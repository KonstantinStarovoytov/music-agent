[project]
name = "musicagent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "deepagents>=0.7.13",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain>=1.4.0",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.4.0",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.6.0",
    "langchain-postgres>=0.0.17",
    "langfuse>=4.15.1",
    "langgraph>=1.2.11",
    "mcp[cli]>=2.1.1",
    "psycopg[binary]>=3.3.5",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "sqlalchemy>=2.0.52",
    "sse-starlette>=3.4.10",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.16.6",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/musicagent"]
